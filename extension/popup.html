<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <title>PasteFlick</title>
    <style>
      :root {
        color-scheme: light;
        --bg0: #f7f7f5;
        --bg1: color-mix(in srgb, #c9a66a 6%, #f7f7f5);
        --well: color-mix(in srgb, #c9a66a 6%, #f7f7f5);
        --char: #5c4a2e;
        --glass: rgba(201, 166, 106, 0.08);
        --glass-2: rgba(201, 166, 106, 0.14);
        --stroke: rgba(201, 166, 106, 0.22);
        --stroke-strong: rgba(201, 166, 106, 0.32);
        --text: #5c4a2e;
        --muted: #8a7358;
        --faint: #a89478;
        --red: #b24c42;
        --red-soft: rgba(178, 76, 66, 0.12);
        --paper: #e4d2ae;
        --core: #f4ead8;
        --earth: #c4a060;
        --wood: #c9a66a;
        --ink: #171410;
        --chip: rgba(201, 166, 106, 0.4);
        --chip-hot: rgba(201, 166, 106, 0.55);
        --chip-label: rgba(201, 166, 106, 0.48);
        --pick: color-mix(in srgb, #c9a66a 10%, #f7f7f5);
        --shine: rgba(244, 226, 180, 0.45);
        --rim: rgba(201, 166, 106, 0.22);
        --card: color-mix(in srgb, #c9a66a 8%, #f7f7f5);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-tap: cubic-bezier(0.32, 0.72, 0, 1);
        --pad-x: 16px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --radius-sm: 7px;
        --radius-md: 10px;
        --radius-lg: 10px;
        --radius-xl: 12px;
        --control-h: 34px;
        --thumb-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 450;
        letter-spacing: -0.011em;
        line-height: 1.35;
        color: var(--text);
        background: #f7f7f5;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      html {
        margin: 0;
        background: var(--bg0);
        overflow: hidden;
      }

      body {
        margin: 0;
        width: 300px;
        padding: 8px;
        overflow: hidden;
        background: var(--bg0);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
        letter-spacing: inherit;
      }

      .shell {
        position: relative;
        padding: 0 var(--pad-x) 12px;
        background: var(--card);
        border: 1px solid var(--rim);
        border-radius: 10px;
        box-shadow: 0 1px 3px rgba(50, 40, 20, 0.05);
        overflow: hidden;
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 calc(-1 * var(--pad-x)) var(--space-3);
        padding: 10px var(--pad-x) 8px;
        min-height: 44px;
        box-shadow: inset 0 -1px 0 var(--stroke);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        display: block;
      }

      .brand .kicker {
        min-width: 0;
        padding: 3px 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 650 12px/1.2 inherit;
        letter-spacing: -0.01em;
        color: var(--ink);
        border-radius: 6px;
        background: var(--chip-label);
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }

      .ghost {
        appearance: none;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 280ms var(--ease-out), color 280ms var(--ease-out);
      }

      .ghost svg {
        display: block;
      }

      #open-settings svg {
        width: 18px;
        height: 18px;
      }

      .ghost:hover {
        background: var(--chip-hot);
        color: var(--ink);
      }

      .ghost:focus-visible,
      .btn:focus-visible,
      .chip-toggle:focus-visible,
      .clip-switch:focus-visible,
      .seg button:focus-visible,
      .path-row:focus-visible {
        outline: 1px solid var(--paper);
        outline-offset: 2px;
      }

      .titlebar.settings-bar {
        justify-content: flex-start;
      }

      .lede {
        margin: 0 0 var(--space-3);
        font-size: 12px;
        color: var(--muted);
      }

      #view-settings .lede {
        font-size: 13px;
        margin-bottom: 10px;
      }

      .mode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 var(--space-3);
      }

      .mode-copy {
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .chip-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: auto;
        height: 24px;
        margin: 0;
        padding: 0 10px 0 8px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        line-height: 1;
        flex: none;
        cursor: pointer;
        transition: background 280ms var(--ease-out), border-color 280ms var(--ease-out), color 280ms var(--ease-out);
      }

      .chip-toggle:hover {
        color: var(--ink);
        background: var(--chip-hot);
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .chip-toggle.on {
        color: var(--ink);
        background: var(--chip);
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .chip-lock {
        width: 12px;
        height: 12px;
        display: grid;
        place-items: center;
        flex: none;
        transform: translateY(-0.5px);
      }

      .chip-lock svg {
        width: 12px;
        height: 12px;
        display: block;
        overflow: visible;
      }

      .chip-toggle .lock-on {
        display: none;
      }

      .chip-toggle.on .lock-on {
        display: block;
      }

      .chip-toggle.on .lock-off {
        display: none;
      }

      .btn {
        display: block;
        width: 100%;
        height: var(--control-h);
        margin: 0 0 var(--space-2);
        border-radius: 7px;
        border: 1px solid var(--stroke);
        background: var(--well);
        color: var(--text);
        font-weight: 650;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(50, 40, 20, 0.05);
        transition: background 280ms var(--ease-out), border-color 280ms var(--ease-out), transform 160ms var(--ease-tap), color 280ms var(--ease-out);
      }

      .btn.primary {
        color: var(--ink);
        background: var(--chip);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .btn:hover:not(:disabled) {
        color: var(--ink);
        background: var(--chip-hot);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .btn.primary:hover:not(:disabled) {
        color: var(--ink);
        background: var(--chip-hot);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn:disabled {
        color: var(--faint);
        cursor: default;
      }

      .home-actions .btn:last-child {
        margin-bottom: 0;
      }

      .hint {
        margin-top: var(--space-3);
        padding: 8px 2px 0;
        border-top: 1px solid var(--stroke);
        font-size: 11px;
        color: var(--faint);
      }

      .idle-note {
        margin: 0;
        padding: 0;
        border: 0;
        line-height: 1.4;
      }

      #status {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }

      #status.err {
        color: color-mix(in srgb, var(--red) 45%, var(--text));
      }

      .page-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .page-form > .btn {
        margin-bottom: 0;
      }

      .paste-pref {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 8px 8px 10px;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        background: var(--card);
        box-shadow: 0 1px 3px rgba(50, 40, 20, 0.05);
      }

      .paste-pref-copy {
        min-width: 0;
        flex: 1;
      }

      .paste-pref-copy strong {
        display: block;
        margin-bottom: 2px;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
      }

      .paste-pref-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .clip-switch {
        appearance: none;
        position: relative;
        flex: 0 0 auto;
        width: 32px;
        height: 18px;
        margin: 0;
        padding: 0;
        border: 1px solid rgba(201, 166, 106, 0.28);
        border-radius: 9px;
        background: rgba(23, 20, 16, 0.22);
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.12);
        overflow: visible;
        transition: background-color 240ms var(--ease-out), border-color 240ms var(--ease-out), filter 240ms var(--ease-out);
      }

      .clip-switch.on {
        background: var(--chip);
        border-color: transparent;
      }

      .clip-switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 6px;
        background: var(--paper);
        box-shadow: none;
        transition: left 280ms var(--ease-out), background-color 240ms var(--ease-out), transform none;
      }

      .clip-switch-thumb::after {
        display: none;
      }

      .clip-switch.on .clip-switch-thumb {
        left: 16px;
        transform: none;
        background: var(--ink);
      }

      .clip-switch:hover {
        filter: brightness(1.08);
      }

      .clip-switch-word {
        display: none;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .file-follow {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }

      .path-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        height: var(--control-h);
        margin: 0;
        padding: 0 10px;
        border-radius: 7px;
        border: 1px solid var(--stroke);
        background: var(--well);
        color: var(--text);
        font-size: 12px;
        font-weight: 450;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(50, 40, 20, 0.05);
      }

      .path-row:hover:not(:disabled) {
        color: var(--ink);
        background: var(--chip-hot);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .path-row:disabled {
        opacity: 0.65;
        cursor: default;
      }

      .path-row span:first-child {
        color: var(--muted);
        flex: none;
      }

      #folder-path {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--text);
      }

      .seg {
        display: flex;
        gap: 4px;
      }

      .seg button {
        flex: 1;
        width: auto;
        height: 28px;
        margin: 0;
        padding: 0 6px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: var(--well);
        color: var(--text);
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        transition: background 280ms var(--ease-out), border-color 280ms var(--ease-out), color 280ms var(--ease-out);
      }

      .seg button:hover {
        color: var(--ink);
        background: var(--chip-hot);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .seg button.on {
        color: var(--ink);
        background: var(--chip);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .version {
        margin: 0;
        font-size: 11px;
        color: var(--faint);
      }

      html.shot,
      html.shot body {
        background: transparent;
        padding: 0;
        height: auto;
        overflow: visible;
      }

      .support {
        margin: 0;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--stroke);
        background: var(--well);
        display: flex;
        flex-direction: column;
      }

      .support p {
        margin: 0 0 6px;
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
      }

      .support p:last-of-type {
        margin-bottom: 8px;
      }

      a.kofi {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        gap: 8px;
        height: 32px;
        padding: 0 16px 0 14px;
        border-radius: 7px;
        background: var(--wood);
        color: var(--ink);
        font: 650 13px/1 inherit;
        letter-spacing: -0.018em;
        text-decoration: none;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.45);
        transition: background 280ms var(--ease-out), transform 160ms var(--ease-tap);
      }

      a.kofi:hover {
        background: color-mix(in srgb, var(--wood) 78%, var(--core));
      }

      a.kofi:active {
        transform: scale(0.98);
      }

      a.kofi svg {
        display: block;
        flex: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .clip-switch-thumb,
        .btn,
        .ghost,
        .chip-toggle,
        a.kofi {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="view-home">
        <header class="titlebar">
          <div class="brand">
            <img src="icons/icon48.png" alt="" width="18" height="18" />
            <span class="kicker">PasteFlick</span>
          </div>
          <div class="chrome">
            <button type="button" class="ghost" id="open-settings" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="3.05" fill="none" stroke="currentColor" stroke-width="1.85" />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.85"
                  stroke-linecap="round"
                  d="M12 3.7v2.15M12 18.15v2.15M3.7 12h2.15M18.15 12h2.15M6.22 6.22l1.52 1.52M16.26 16.26l1.52 1.52M6.22 17.78l1.52-1.52M16.26 7.74l1.52-1.52"
                />
              </svg>
            </button>
          </div>
        </header>
        <p class="lede">Open a chat.</p>
        <p class="hint idle-note">The icon opens the thread. Settings is the gear.</p>
      </div>

      <div id="view-settings" hidden>
        <header class="titlebar settings-bar">
          <button type="button" class="ghost" id="back-home" title="Back" aria-label="Back">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M10.25 3.25 5.5 8l4.75 4.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <span class="brand"><span class="kicker">Settings</span></span>
        </header>
        <p class="lede">How copies leave the chat.</p>
        <div class="page-form">
          <div class="paste-pref">
            <div class="paste-pref-copy">
              <strong>Flick</strong>
              <p id="paste-pref-hint">Stays on the clipboard.</p>
            </div>
            <button type="button" id="auto-paste-lock" class="clip-switch" role="switch" aria-checked="false" aria-label="Flick">
              <span class="clip-switch-word on">on</span>
              <span class="clip-switch-word off">off</span>
              <span class="clip-switch-thumb"></span>
            </button>
          </div>

          <div class="field">
            <span>Send copies to</span>
            <div class="seg" role="radiogroup" aria-label="Send copies to">
              <button type="button" id="dest-clipboard" class="on" data-dest="clipboard" aria-pressed="true">Clipboard</button>
              <button type="button" id="dest-file" data-dest="file" aria-pressed="false">File</button>
            </div>
          </div>

          <div class="field" id="file-opts">
            <span>Save as</span>
            <div class="seg" role="radiogroup" aria-label="Save as">
              <button type="button" id="format-md" class="on" data-format="md" aria-pressed="true">Markdown</button>
              <button type="button" id="format-pdf" data-format="pdf" aria-pressed="false">PDF</button>
            </div>
            <button type="button" class="path-row" id="folder-pick" title="Documents\PasteFlick">
              <span>Save to</span>
              <span id="folder-path">Documents\PasteFlick</span>
            </button>
          </div>

          <button type="button" id="add-browser" class="btn">Add to a browser</button>
          <div class="support">
            <p>Help me keep creating useful apps and sharing them freely.</p>
            <p>No pressure—just genuine appreciation!</p>
            <a class="kofi" id="tip-kofi" href="https://ko-fi.com/ryandunham" title="Opens Ko-fi">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round" d="M3.4 5.6h7.2v4.3A2.6 2.6 0 0 1 8 12.5H6a2.6 2.6 0 0 1-2.6-2.6V5.6z" />
                <path fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" d="M10.6 6.4h1.15a1.7 1.7 0 1 1 0 3.4H10.6" />
              </svg>
              Leave a tip
            </a>
          </div>
          <p class="version" id="version"></p>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
