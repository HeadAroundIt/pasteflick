<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>PasteFlick</title>
    <style>
      :root {
        color-scheme: dark;
        --bg0: #1e1e1e;
        --bg1: #262626;
        --well: #161616;
        --char: #3a3a3a;
        --glass: rgba(201, 166, 106, 0.06);
        --glass-2: rgba(201, 166, 106, 0.1);
        --stroke: rgba(201, 166, 106, 0.16);
        --stroke-strong: rgba(201, 166, 106, 0.28);
        --text: #e4d2ae;
        --muted: #b09a78;
        --faint: #8a7a62;
        --red: #b24c42;
        --red-soft: rgba(178, 76, 66, 0.18);
        --paper: #e4d2ae;
        --core: #f4ead8;
        --earth: #c4a060;
        --wood: #c9a66a;
        --ink: #171410;
        --chip: rgba(201, 166, 106, 0.48);
        --chip-hot: rgba(228, 210, 174, 0.58);
        --pick: color-mix(in srgb, var(--wood) 12%, var(--bg0));
        --shine: rgba(244, 226, 180, 0.22);
        --rim: rgba(201, 166, 106, 0.16);
        --pad-x: 16px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --radius-sm: 7px;
        --radius-md: 10px;
        --radius-lg: 10px;
        --radius-xl: 12px;
        --control-h: 34px;
        --thumb-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 450;
        letter-spacing: -0.011em;
        line-height: 1.35;
        color: var(--text);
        background: #1e1e1e;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      html {
        margin: 0;
        background: var(--bg0);
      }

      body {
        margin: 0;
        width: 300px;
        padding: 8px;
        background: var(--bg0);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
        letter-spacing: inherit;
      }

      .shell {
        position: relative;
        padding: 0 var(--pad-x) 12px;
        background: var(--bg0);
        border: 1px solid var(--rim);
        border-radius: var(--radius-xl);
        box-shadow:
          inset 0 1px 0 var(--shine),
          0 1px 6px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 calc(-1 * var(--pad-x)) var(--space-3);
        padding: 10px var(--pad-x) 8px;
        min-height: 44px;
        box-shadow: inset 0 -1px 0 var(--stroke);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        display: block;
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }

      .ghost {
        appearance: none;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      .ghost svg {
        display: block;
      }

      #open-settings svg {
        width: 18px;
        height: 18px;
      }

      .ghost:hover {
        background: var(--glass-2);
        color: var(--text);
      }

      .ghost:focus-visible,
      .btn:focus-visible,
      .chip-toggle:focus-visible,
      .clip-switch:focus-visible,
      .seg button:focus-visible,
      .path-row:focus-visible {
        outline: 1px solid var(--paper);
        outline-offset: 2px;
      }

      .titlebar.settings-bar {
        justify-content: flex-start;
      }

      .lede {
        margin: 0 0 var(--space-3);
        font-size: 12px;
        color: var(--muted);
      }

      #view-settings .lede {
        font-size: 14px;
        margin-bottom: 16px;
      }

      .mode-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 var(--space-3);
      }

      .mode-copy {
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .chip-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: auto;
        height: 24px;
        margin: 0;
        padding: 0 10px 0 8px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        line-height: 1;
        flex: none;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .chip-toggle:hover {
        color: var(--ink);
        background: var(--chip-hot);
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .chip-toggle.on {
        color: var(--ink);
        background: var(--chip);
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .chip-lock {
        width: 12px;
        height: 12px;
        display: grid;
        place-items: center;
        flex: none;
        transform: translateY(-0.5px);
      }

      .chip-lock svg {
        width: 12px;
        height: 12px;
        display: block;
        overflow: visible;
      }

      .chip-toggle .lock-on {
        display: none;
      }

      .chip-toggle.on .lock-on {
        display: block;
      }

      .chip-toggle.on .lock-off {
        display: none;
      }

      .btn {
        display: block;
        width: 100%;
        height: var(--control-h);
        margin: 0 0 var(--space-2);
        border-radius: var(--radius-md);
        border: 1px solid var(--stroke);
        background: var(--bg1);
        color: var(--text);
        font-weight: 650;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.08);
        transition: background 120ms ease, border-color 120ms ease, transform 80ms ease, color 120ms ease;
      }

      .btn.primary {
        color: var(--ink);
        background: var(--chip);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--wood) 10%, var(--bg1));
        border-color: var(--stroke-strong);
      }

      .btn.primary:hover:not(:disabled) {
        color: var(--ink);
        background: var(--chip-hot);
      }

      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn:disabled {
        color: var(--faint);
        cursor: default;
      }

      .home-actions .btn:last-child {
        margin-bottom: 0;
      }

      .hint {
        margin-top: var(--space-3);
        padding: 8px 2px 0;
        border-top: 1px solid var(--stroke);
        font-size: 11px;
        color: var(--faint);
      }

      #status {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }

      #status.err {
        color: color-mix(in srgb, var(--red) 45%, var(--text));
      }

      .page-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .paste-pref {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--stroke);
        border-radius: var(--radius-lg);
        background: var(--bg1);
        box-shadow: inset 0 1px 0 var(--shine);
      }

      .paste-pref-copy {
        min-width: 0;
        flex: 1;
      }

      .paste-pref-copy strong {
        display: block;
        margin-bottom: 2px;
        color: var(--text);
        font-size: 13px;
        font-weight: 650;
      }

      .paste-pref-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .clip-switch {
        position: relative;
        flex: 0 0 auto;
        width: 44px;
        height: 22px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        background: var(--well);
        cursor: pointer;
        overflow: hidden;
        transition: background 160ms ease, border-color 160ms ease;
      }

      .clip-switch.on {
        background: var(--chip);
        border-color: transparent;
      }

      .clip-switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 2px;
        background:
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--core) 22%, transparent),
            transparent 50%,
            color-mix(in srgb, #5c3d28 10%, transparent)
          ),
          repeating-linear-gradient(
            92deg,
            var(--wood),
            var(--wood) 2px,
            color-mix(in srgb, var(--wood) 88%, #6b4428) 3px,
            var(--wood) 4px
          );
        box-shadow:
          var(--thumb-shadow),
          inset 0 0 0 1px color-mix(in srgb, #5c3d28 12%, transparent);
        transition: transform 160ms ease;
      }

      .clip-switch-thumb::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 3px;
        bottom: 3px;
        width: 1px;
        background: color-mix(in srgb, #5c3d28 16%, transparent);
      }

      .clip-switch.on .clip-switch-thumb {
        transform: translateX(24px);
      }

      .clip-switch-word {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .clip-switch-word.on {
        left: 5px;
        color: var(--ink);
        opacity: 0;
      }

      .clip-switch-word.off {
        right: 4px;
        color: var(--faint);
        opacity: 1;
      }

      .clip-switch.on .clip-switch-word.on {
        opacity: 1;
      }

      .clip-switch.on .clip-switch-word.off {
        opacity: 0;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .file-follow {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }

      .path-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        height: var(--control-h);
        margin: 0;
        padding: 0 10px;
        border-radius: var(--radius-md);
        border: 1px solid var(--stroke);
        background: var(--bg1);
        color: var(--text);
        font-size: 12px;
        font-weight: 450;
        text-align: left;
        cursor: pointer;
        box-shadow: inset 0 1px 0 var(--shine);
      }

      .path-row:hover:not(:disabled) {
        background: var(--pick);
        border-color: var(--stroke-strong);
      }

      .path-row:disabled {
        opacity: 0.65;
        cursor: default;
      }

      .path-row span:first-child {
        color: var(--muted);
        flex: none;
      }

      #folder-path {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--text);
      }

      .seg {
        display: flex;
        gap: 4px;
      }

      .seg button {
        flex: 1;
        width: auto;
        height: 28px;
        margin: 0;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--stroke);
        background: var(--bg1);
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .seg button:hover {
        color: var(--ink);
        background: var(--chip-hot);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .seg button.on {
        color: var(--ink);
        background: var(--chip);
        border-color: transparent;
        box-shadow: inset 0 1px 0 rgba(244, 226, 180, 0.35);
      }

      .version {
        margin: 0;
        font-size: 11px;
        color: var(--faint);
      }

      @media (prefers-reduced-motion: reduce) {
        .clip-switch-thumb,
        .btn,
        .ghost,
        .chip-toggle {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="view-home">
        <header class="titlebar">
          <div class="brand">
            <img src="icons/icon48.png" alt="" width="18" height="18" />
            <span>PasteFlick</span>
          </div>
          <div class="chrome">
            <button type="button" class="ghost" id="open-settings" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="3.05" fill="none" stroke="currentColor" stroke-width="1.85" />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.85"
                  stroke-linecap="round"
                  d="M12 3.7v2.15M12 18.15v2.15M3.7 12h2.15M18.15 12h2.15M6.22 6.22l1.52 1.52M16.26 16.26l1.52 1.52M6.22 17.78l1.52-1.52M16.26 7.74l1.52-1.52"
                />
              </svg>
            </button>
          </div>
        </header>
        <p class="lede">Copy any part of a chat.</p>
        <div class="mode-row">
          <span class="mode-copy" id="dest-copy">Copies stay on the clipboard</span>
          <button type="button" id="auto-paste" class="chip-toggle" aria-pressed="false" title="Auto-paste off — copies stay on the clipboard">
            <span class="chip-lock" aria-hidden="true">
              <svg class="lock-on" viewBox="0 0 24 24">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 11V8.15a4 4 0 0 1 8 0V11" />
                <rect x="6.25" y="11" width="11.5" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
              </svg>
              <svg class="lock-off" viewBox="0 0 24 24">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 11V8.15A4 4 0 0 0 8.35 6.4" />
                <rect x="6.25" y="11" width="11.5" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
            Auto-paste
          </button>
        </div>
        <div class="home-actions">
          <button type="button" id="select-view" class="btn primary">Copy selection</button>
          <button type="button" id="full" class="btn">Copy thread</button>
          <button type="button" id="from-pasteflick" class="btn" disabled>Copy from PasteFlick</button>
          <button type="button" id="open-from-pasteflick" class="btn" disabled>Open from PasteFlick</button>
        </div>
        <div class="hint">
          <span id="status">Open a chat.</span>
        </div>
      </div>

      <div id="view-settings" hidden>
        <header class="titlebar settings-bar">
          <button type="button" class="ghost" id="back-home" title="Back" aria-label="Back">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M10.25 3.25 5.5 8l4.75 4.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <span class="brand">Settings</span>
        </header>
        <p class="lede">How copies leave the chat.</p>
        <div class="page-form">
          <div class="paste-pref">
            <div class="paste-pref-copy">
              <strong>Auto-paste</strong>
              <p id="paste-pref-hint">Stays on the clipboard.</p>
            </div>
            <button type="button" id="auto-paste-lock" class="clip-switch" role="switch" aria-checked="false" aria-label="Auto-paste">
              <span class="clip-switch-word on">on</span>
              <span class="clip-switch-word off">off</span>
              <span class="clip-switch-thumb"></span>
            </button>
          </div>

          <div class="field">
            <span>Send copies to</span>
            <div class="seg" role="radiogroup" aria-label="Send copies to">
              <button type="button" id="dest-clipboard" class="on" data-dest="clipboard" aria-pressed="true">Clipboard</button>
              <button type="button" id="dest-file" data-dest="file" aria-pressed="false">File</button>
            </div>
          </div>

          <div class="field" id="file-opts">
            <span>Save as</span>
            <div class="seg" role="radiogroup" aria-label="Save as">
              <button type="button" id="format-md" class="on" data-format="md" aria-pressed="true">Markdown</button>
              <button type="button" id="format-pdf" data-format="pdf" aria-pressed="false">PDF</button>
            </div>
            <button type="button" class="path-row" id="folder-pick" title="Documents\PasteFlick">
              <span>Save to</span>
              <span id="folder-path">Documents\PasteFlick</span>
            </button>
          </div>

          <button type="button" id="add-browser" class="btn">Add to a browser</button>
          <p class="version" id="version"></p>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
